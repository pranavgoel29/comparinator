<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Two region frames = compare -->
  <rect x="4" y="6" width="10" height="10" rx="2" stroke="#e0e7ff" stroke-width="1.5" fill="none" opacity=".95"/>
  <rect x="18" y="16" width="10" height="10" rx="2" stroke="#e0e7ff" stroke-width="1.5" fill="none" opacity=".95"/>
  <!-- Link dot between them -->
  <circle cx="16" cy="16" r="2" fill="#c7d2fe"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
</svg>
